<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Agenda Surat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="wrap hd">
      <div class="brand">
        <img src="logo unisa.png.jpg" alt="Logo" onerror="this.style.display='none'">
        <div>
          <h1>Buku Agenda Surat Masuk dan Keluar</h1>
          <p>Sistem Administrasi Surat Universitas Islam Al-Ihya Kuningan</p>
        </div>
      </div>
      <div class="sp"></div>
      <div class="search" id="sbox">
        <span id="sIc"></span>
        <input id="gs" placeholder="Cari nomor agenda, instansi, perihal...   ( tekan / )" autocomplete="off">
        <button id="gc" aria-label="Hapus"></button>
      </div>
      <div class="chip-d" id="dt"></div>
      <button class="ibtn" id="theme" title="Ganti tema"></button>
      <button class="ibtn" id="out" title="Keluar akun"></button>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div id="view" class="view"></div>
    </div>
  </main>

  <footer>
    Copyright &copy; <span id="yr"></span> by <strong>Muhamad Rizki Ramdani</strong><br>
    Sistem Administrasi Buku Agenda Surat Masuk dan Keluar
  </footer>

  <nav class="dock" id="dock" aria-label="Menu utama"></nav>
  <div class="ov" id="ov">
    <div class="md" id="md"></div>
  </div>
  <div class="toasts" id="toasts"></div>
  <div id="pa"></div>
  <input type="file" id="file" accept=".json,application/json" hidden>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
